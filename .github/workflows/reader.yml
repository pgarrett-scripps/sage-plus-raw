name: Reader checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo fmt --all --check
      - run: cargo clippy --locked -p sage-plus-raw --all-targets -- -D warnings
      - run: cargo test --locked -p sage-plus-raw
      - run: python scripts/fetch_public_fixtures.py
      - run: python scripts/prepare_reference_arrays.py
      - run: cargo test --locked -p sage-plus-raw --test public_fixtures -- --ignored
        env:
          THERMO_PUBLIC_CORPUS: corpus/public
      - run: cargo doc --locked -p sage-plus-raw --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo check --locked -p sage-plus-raw
  fuzz-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-09-26
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo +stable install cargo-fuzz --version 0.13.1 --locked
      - run: python scripts/fetch_public_fixtures.py
      - run: python scripts/seed_fuzz.py
      - run: cargo metadata --locked --manifest-path crates/sage-plus-raw/fuzz/Cargo.toml --format-version 1 > /dev/null
      - name: Bounded public-fixture fuzzing
        working-directory: crates/sage-plus-raw
        run: |
          for target in open read_scan_peaks strict_decode
          do
            cargo fuzz run "$target" -- -max_total_time=20 -timeout=5 -rss_limit_mb=1024 -max_len=1048576 -seed=42
          done
