[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "opentfraw-reader"
description = "Rust parser for Thermo Fisher RAW mass spectrometry files"
keywords = ["mass-spectrometry", "thermo", "raw", "proteomics", "orbitrap"]
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Nathan Riley", email = "git@nathanriley.com" }]
requires-python = ">=3.8"
dynamic = ["version"]
dependencies = ["numpy>=1.20"]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: Apache Software License",
]

[project.urls]
Homepage = "https://github.com/pgarrett-scripps/opentfraw"
Source = "https://github.com/pgarrett-scripps/opentfraw"
Changelog = "https://github.com/pgarrett-scripps/opentfraw/blob/main/CHANGELOG.md"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "opentfraw"
manifest-path = "crates/opentfraw-py/Cargo.toml"
include = [
    { path = "LICENSE", format = "sdist" },
    { path = "README.md", format = "sdist" },
    { path = "CHANGELOG.md", format = "sdist" },
    { path = "README.md", format = "wheel" },
]

[dependency-groups]
dev = [
    "maturin>=1.14.1",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
