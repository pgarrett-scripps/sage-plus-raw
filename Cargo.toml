[workspace]
resolver = "2"
members = ["crates/sage-plus-raw"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Nathan Riley <git@nathanriley.com>", "Sage Plus contributors"]
license = "Apache-2.0"
repository = "https://github.com/pgarrett-scripps/opentfraw"
homepage = "https://github.com/pgarrett-scripps/opentfraw"
keywords = ["mass-spectrometry", "thermo", "raw", "proteomics", "orbitrap"]
