[workspace]
resolver = "2"
members = ["crates/opentfraw", "crates/opentfraw-py"]
default-members = ["crates/opentfraw"]

[workspace.package]
version = "0.1.0-rc.2"
edition = "2021"
rust-version = "1.85"
authors = ["Nathan Riley <git@nathanriley.com>", "opentfraw-reader contributors"]
license = "Apache-2.0"
repository = "https://github.com/pgarrett-scripps/opentfraw"
homepage = "https://github.com/pgarrett-scripps/opentfraw"
keywords = ["mass-spectrometry", "thermo", "raw", "proteomics", "orbitrap"]
categories = ["parser-implementations", "science"]

[workspace.dependencies]
opentfraw = { package = "opentfraw-reader", path = "crates/opentfraw", version = "0.1.0-rc.2" }
openmassspec-core = "1.5.0"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py38"] }
numpy = "0.29"

[workspace.lints.rust]
unsafe_code = "forbid"
