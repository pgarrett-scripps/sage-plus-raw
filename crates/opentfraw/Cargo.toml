[package]
publish = false
name = "opentfraw-reader"
description = "Independent OpenTFRaw fork for native Thermo RAW reading with strict extraction and qualified metadata."
readme = "../../README.md"
include = ["src/**", "examples/**", "tests/**", "Cargo.toml", "README.md", "LICENSE", "NOTICE", "ATTRIBUTION.md", "CONTRIBUTORS.md", "SECURITY.md", "REVIEW.md", "RELEASING.md"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "opentfraw"

[package.metadata.docs.rs]
all-features = true

[lints.rust]
unsafe_code = "forbid"

[dependencies]
thiserror = "2"
openmassspec-core = { workspace = true }

[dev-dependencies]
