[package]
name = "sage-plus-raw"
description = "Pure-Rust reader for Thermo Fisher RAW mass spectrometry files, forked from Sigilweaver OpenTFRaw."
readme = "../../README.md"
include = ["src/**", "examples/**", "tests/**", "Cargo.toml", "LICENSE", "NOTICE", "README.md"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "sage_plus_raw"

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[lints.rust]
unsafe_code = "forbid"

[dependencies]
thiserror = "2"
roxmltree = "0.21"

[dev-dependencies]
